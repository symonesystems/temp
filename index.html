<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYMONE SYSTEMS</title>
</head>
<body style="margin: 0; padding: 0; background-color: #14161D; min-height: 100vh; width: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; box-sizing: border-box; -webkit-tap-highlight-color: transparent;">

    <!-- Main centered container strictly showcasing the brand logo image -->
    <main id="logo-stage" style="display: flex; align-items: center; justify-content: center; width: 100%; padding: 24px; box-sizing: border-box;">
        <img 
            id="symone-logo"
            src="symonesystems-logo.jpeg" 
            alt="SYMONE SYSTEMS"
            onerror="this.onerror=null; this.src='https://placehold.co/600x600/14161D/FFFFFF?text=SYMONE+SYSTEMS';"
            style="width: 100%; max-width: 520px; height: auto; display: block; border-radius: 18px; opacity: 0; transform: translateY(12px) scale(0.985); transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), filter 0.5s ease; cursor: pointer; user-select: none; -webkit-user-select: none;"
        >
    </main>

    <script>
        // Inline interaction logic for smooth entrance and circuit-accented hover/tap glow
        (function () {
            const logo = document.getElementById('symone-logo');
            if (!logo) return;

            let isActive = false;

            // Smooth entrance animation once page resources are ready
            window.addEventListener('load', function () {
                requestAnimationFrame(function () {
                    logo.style.opacity = '1';
                    logo.style.transform = 'translateY(0) scale(1)';
                });
            });

            // Fallback in case the image is already cached before window load fires
            if (document.readyState === 'complete') {
                logo.style.opacity = '1';
                logo.style.transform = 'translateY(0) scale(1)';
            }

            // Apply dual cyan (#24C6F2) and red (#EE3124) circuit glow on hover/focus
            function activateGlow() {
                isActive = true;
                logo.style.transform = 'translateY(-3px) scale(1.018)';
                logo.style.filter = 'drop-shadow(0 -8px 26px rgba(36, 198, 242, 0.24)) drop-shadow(0 8px 26px rgba(238, 49, 36, 0.22))';
            }

            // Restore neutral resting state
            function deactivateGlow() {
                isActive = false;
                logo.style.transform = 'translateY(0) scale(1)';
                logo.style.filter = 'none';
            }

            // Desktop pointer events
            logo.addEventListener('mouseenter', activateGlow);
            logo.addEventListener('mouseleave', deactivateGlow);

            // Mobile & touch tap responsiveness
            logo.addEventListener('touchstart', function () {
                activateGlow();
            }, { passive: true });

            logo.addEventListener('touchend', function () {
                setTimeout(deactivateGlow, 350);
            }, { passive: true });

            // Subtle interactive pulse on click/tap
            logo.addEventListener('click', function () {
                logo.style.transform = 'translateY(-1px) scale(0.995)';
                setTimeout(function () {
                    if (isActive) {
                        activateGlow();
                    } else {
                        deactivateGlow();
                    }
                }, 140);
            });
        })();
    </script>
</body>
</html>
